server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy all /api calls to the backend container.
    # "backend" is resolved by Docker's internal DNS to the backend service.
    location /api {
        proxy_pass         http://backend:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Agent calls can take a while — give them a long timeout.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # SPA: serve index.html for any route that isn't a real file.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively.
    location ~* \.(js|css|png|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
