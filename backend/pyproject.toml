[project]
name = "repopilot-ai-backend"
version = "0.1.0"
description = "RepoPilot AI — agentic codebase intelligence backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "networkx>=3.0",
    "chromadb>=0.4.0",
    "sentence-transformers>=2.7.0",
    "litellm>=1.103.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "httpx2>=0.28.0",
    "pytest-asyncio>=0.23.0",
    "aiosqlite>=0.19.0",
]

[tool.uv]
# Force source build so Windows Application Control policy doesn't block Cython DLLs.
no-binary-package = ["sqlalchemy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
